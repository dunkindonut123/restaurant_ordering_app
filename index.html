<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-banner">
        <h1>Jimmy's Diner</h1>
        <p>The best burger and pizzas in town</p>
    </div>
    <div class="container">

    </div>

    <div class="order-section">
        <p>Your order</p>
        <div class="order-list">
            
        </div>

        <div class="total-list">
            <p>Total Price:</p>
            <p id="total-price">$0</p>
        </div>
        <button id="complete-btn" class="green-btn">Complete order</button>
    </div>

    <div class="complete-order">
        <p id="thanks-message"></p>
    </div>

    <form class="payment-modal hidden">
        <p class="fw-b fs-25">Enter card details</p>
        <div class="input-container">
            <input type="text" placeholder="Enter your name" id="name-input" required></input>
            <input type="text" placeholder="Enter card number" id="card-input" required></input>
            <input type="text" placeholder="Enter CVV" id="cvv-input" required></input>
        </div>
        <button type="submit" id="pay-btn" class="green-btn">Pay</button>
    </form>

    <script src="./index.js" type="module"></script>

    
</body>
</html>
